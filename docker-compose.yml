services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: eggfarm
      POSTGRES_PASSWORD: eggfarm
      POSTGRES_DB: eggfarm
    ports:
      - "5433:5432"
    volumes:
      - eggfarm_pg_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eggfarm"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  eggfarm_pg_data:
