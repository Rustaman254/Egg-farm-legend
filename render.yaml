# Render Blueprint for the Go backend, free tier (Render dashboard -> New -> Blueprint -> this repo).
#
# One free web service runs everything: the REST API, the chain indexers, the arena WebSocket hub,
# and (RUN_WORKER=true) the background jobs that would otherwise be cmd/worker -- Render's free
# tier has no background workers. AUTO_MIGRATE=true creates the tables on startup, since free
# instances have no pre-deploy step. Postgres is Supabase's free tier (Render's own free Postgres
# is deleted after 30 days), passed in as DATABASE_URL.
#
# Free web services sleep after 15 minutes without inbound traffic, which would pause the
# indexers. Point a free uptime monitor (UptimeRobot, cron-job.org) at /healthz every 10 minutes
# to keep it awake; one service running 24/7 fits in the free 750 instance-hours a month.
#
# Keep this at ONE instance: the indexers and jobs run in-process, so a second copy would handle
# every event twice.
#
# Values marked `sync: false` are prompted for when the Blueprint is created.

services:
  - name: eggfarm-api
    type: web
    plan: free
    runtime: docker
    region: frankfurt # closest Render region to the Supabase project (eu-west-1)
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: eggfarm-server
    healthCheckPath: /healthz
    envVars:
      # Supabase -> Connect -> "Session pooler" connection string (port 5432, IPv4), with your
      # database password filled in and ?sslmode=require appended. Not the transaction pooler
      # (port 6543, pgbouncer=true): pgx's prepared-statement cache breaks behind it.
      - key: DATABASE_URL
        sync: false
      - key: RUN_WORKER
        value: "true"
      - key: AUTO_MIGRATE
        value: "true"
      - key: CHAIN_ID
        value: "421614"
      - key: ARBITRUM_SEPOLIA_RPC_URL
        value: https://sepolia-rollup.arbitrum.io/rpc
      # From `forge script script/Deploy.s.sol` (and DeployBattleEscrow.s.sol) output.
      - key: FEED_TOKEN_ADDRESS
        sync: false
      - key: EGG_NFT_ADDRESS
        sync: false
      - key: CREATURE_NFT_ADDRESS
        sync: false
      - key: MARKETPLACE_ADDRESS
        sync: false
      - key: BATTLE_ESCROW_ADDRESS
        sync: false
      - key: DEPLOY_BLOCK
        sync: false
      - key: TREASURY_ADDRESS
        sync: false
      - key: BACKEND_SIGNER_PRIVATE_KEY
        sync: false
      - key: ARB_TOKEN_ADDRESS
        sync: false
